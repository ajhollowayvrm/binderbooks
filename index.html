<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch and the home indicator, which is what
         makes env(safe-area-inset-*) report real numbers instead of 0. The native shell pins its web
         view edge to edge and relies on the CSS below to inset the content. maximum-scale is kept
         for non-iOS browsers; iOS has ignored it since iOS 10, so the shell locks zoom natively. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>BinderBooks — Card P&L Ledger</title>
    <!-- The favicon is the tab icon for `npm run dev` and for the hosted build on GitHub Pages.
         There is deliberately no web app manifest and no apple-touch-icon: both exist to install a
         hosted site to the home screen, and the phone runs the real iOS app, whose icon comes from
         the asset catalogue. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#0c0e13" />
    <style>html,body,#root{height:100%;margin:0;background:#0c0e13;}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
