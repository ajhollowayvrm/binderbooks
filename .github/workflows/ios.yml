name: iOS ipa

# Builds an UNSIGNED .ipa on a macOS runner and uploads it as a workflow artifact.
#
# There are no certificates, provisioning profiles or secrets anywhere in here, and that is the
# point. Compiling needs macOS + Xcode; SIGNING needs your Apple ID. Only the first belongs in CI —
# AltStore/SideStore re-signs the .ipa locally with your Apple ID when it installs, and would strip
# and redo any signature applied here anyway. So CI does the half that needs a Mac and you do the
# half that needs your account.
#
# To install: Actions → this run → Artifacts → binderbooks-ipa → unzip → hand the .ipa to SideStore.
# On a free Apple ID the install expires after 7 days, but SideStore refreshes the signature
# on-device from the same file.
#
# On a Mac this whole workflow is unnecessary: `npm run ios && open ios/BinderBooks.xcodeproj`, then
# ⌘R installs straight to a plugged-in phone.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'ios/**'
      - 'scripts/gen-icons.mjs'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ios/www is gitignored, and the Xcode target carries it in as a folder reference. If this
      # step is skipped, xcodegen fails on a missing source path rather than building an empty app.
      - name: Build the web bundle for the shell
        run: npm run build:ios

      - name: Generate the app icon
        run: npm run ios:icon

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project ios/BinderBooks.xcodeproj \
            -scheme BinderBooks \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BinderBooks.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # `xcodebuild -exportArchive` insists on a signing identity, so the .ipa is assembled by hand.
      # An .ipa is just a zip with the .app inside a top-level Payload/ directory — that's the whole
      # format, and it is exactly what SideStore expects to be handed.
      - name: Package as .ipa
        run: |
          APP="$RUNNER_TEMP/BinderBooks.xcarchive/Products/Applications/BinderBooks.app"
          test -d "$APP" || { echo "no .app in the archive"; exit 1; }
          test -f "$APP/www/index.html" || { echo "the web bundle is missing from the .app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry binderbooks-unsigned.ipa Payload
          echo "built $(du -h binderbooks-unsigned.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: binderbooks-ipa
          path: ${{ runner.temp }}/binderbooks-unsigned.ipa
          if-no-files-found: error
