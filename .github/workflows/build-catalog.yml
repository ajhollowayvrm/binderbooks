name: Build catalog

# Builds catalog.sqlite from TCGCSV and publishes it to the public release
# `catalog-latest`. The iOS app downloads it from there. See docs/01-catalog-pipeline.md
# and catalog/README.md.

on:
  schedule:
    # TCGCSV updates at about 20:00 UTC. 21:30 UTC leaves a margin.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A queued run replaces an older one. Two runs must not race on the release assets.
concurrency:
  group: build-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s catalog -v

      - name: Build catalog
        run: python catalog/build_catalog.py --out build
        env:
          CATALOG_RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/catalog-latest/catalog.sqlite.gz

      - name: Publish to release catalog-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=catalog-latest
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Catalog (latest)" \
              --notes "Rolling release. Every successful build replaces the assets." \
              --latest=false
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            build/catalog.sqlite.gz build/catalog-manifest.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --notes "Rolling release. Every successful build replaces the assets. Last build: $(date -u +%Y-%m-%dT%H:%M:%SZ) from $GITHUB_SHA"

      - name: Add the build report to the job summary
        if: always()
        run: |
          if [ -f build/build-report.md ]; then cat build/build-report.md >> "$GITHUB_STEP_SUMMARY"; fi
